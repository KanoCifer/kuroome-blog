<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomu 邮件模板预览 · Pillow</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}

  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','PingFang SC','Helvetica Neue',sans-serif;
    background:#E5E5EA;
    color:#1D1D1F;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }

  .harness{padding:56px 24px 120px;min-height:100vh}
  .harness-header{
    max-width:680px;margin:0 auto 32px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .h-eyebrow{
    font-size:11px;font-weight:600;letter-spacing:0.6px;color:#6E6E73;
    text-transform:uppercase;margin:0 0 8px;
  }
  .h-title{
    font-size:28px;font-weight:700;letter-spacing:-0.022em;color:#1D1D1F;
    margin:0;line-height:1.1;
  }
  .h-sub{
    font-size:14px;color:#6E6E73;margin:6px 0 0;letter-spacing:-0.1px;
  }
  .h-meta{
    font-size:12px;color:#6E6E73;font-variant-numeric:tabular-nums;letter-spacing:0.2px;
  }

  .stage{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:32px}

  .email-block{display:flex;flex-direction:column;gap:12px}
  .email-section-label{
    display:flex;align-items:center;gap:10px;
    font-size:11px;font-weight:600;letter-spacing:0.6px;color:#6E6E73;text-transform:uppercase;
    padding:0 4px;
  }
  .email-section-label::before{
    content:"";width:6px;height:6px;border-radius:50%;background:#C7C7CC;flex:none;
  }

  .email-frame{
    background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.04),
      0 18px 48px rgba(0,0,0,0.08),
      0 4px 12px rgba(0,0,0,0.04);
  }
  .email-frame-meta{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 20px;border-bottom:1px solid rgba(0,0,0,0.06);
    background:rgba(248,248,250,0.7);
    font-size:12px;line-height:1.2;
  }
  .email-from{color:#1D1D1F;font-weight:600;letter-spacing:-0.1px}
  .email-subject{color:#6E6E73;flex:1;text-align:center;letter-spacing:-0.1px}
  .email-date{color:#8E8E93;font-variant-numeric:tabular-nums}
  .email-frame-body{background:#fff}

  /* === Fields panel === */
  .fields-panel{
    margin:6px 4px 0;
    padding:14px 16px;
    border-radius:14px;
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(0,0,0,0.06);
    font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
    font-size:11.5px;
    line-height:1.7;
    color:#3C3C43;
    display:grid;
    grid-template-columns:auto 1fr;
    column-gap:14px;
    row-gap:2px;
  }
  .fields-panel-title{
    grid-column:1 / -1;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
    font-size:10.5px;font-weight:600;letter-spacing:0.7px;
    color:#8E8E93;text-transform:uppercase;
    margin:0 0 6px;
  }
  .fields-key{color:#8E8E93;white-space:nowrap}
  .fields-val{color:#1D1D1F;word-break:break-word}

  @media (prefers-reduced-motion:no-preference){
    .email-block{
      opacity:0;transform:translateY(6px);
      animation:emerge 380ms cubic-bezier(0.23,1,0.32,1) forwards;
    }
    .email-block:nth-of-type(1){animation-delay:0ms}
    .email-block:nth-of-type(2){animation-delay:50ms}
    .email-block:nth-of-type(3){animation-delay:100ms}
  }
  @keyframes emerge{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .email-block{opacity:1;transform:none;animation:none}
  }

  /* === Picker — verbatim from PICKER.md === */
  .proto-picker{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    z-index:2147483647;
    display:flex;align-items:center;gap:2px;
    padding:4px;border-radius:999px;
    background:rgba(10,10,10,0.82);
    -webkit-backdrop-filter:blur(12px) saturate(1.4);
    backdrop-filter:blur(12px) saturate(1.4);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08) inset,
      0 8px 24px rgba(0,0,0,0.24),
      0 2px 6px rgba(0,0,0,0.12);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:13px;line-height:1;
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
  }
  .proto-picker-highlight{
    position:absolute;top:4px;left:0;height:28px;border-radius:999px;
    background:rgba(255,255,255,0.12);will-change:transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight{
    transition:
      transform 250ms cubic-bezier(0.23,1,0.32,1),
      width 250ms cubic-bezier(0.23,1,0.32,1);
  }
  @media (prefers-reduced-motion:reduce){
    .proto-picker[data-ready] .proto-picker-highlight{transition:none}
  }
  .proto-picker-item{
    position:relative;display:flex;align-items:center;height:28px;padding:0 12px;
    border:0;border-radius:999px;background:transparent;
    color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;
    transition:color 150ms ease-out;
  }
  .proto-picker-item:hover{color:rgba(255,255,255,0.85)}
  .proto-picker-item:active{transform:scale(0.97)}
  .proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
  .proto-picker-item[data-active]{color:#fff}
  .proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12)}
  .proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<div class="harness">
  <header class="harness-header">
    <div>
      <p class="h-eyebrow">Locked · Pillow design</p>
      <h1 class="h-title">Nomu 验证码邮件 · Pillow</h1>
      <p class="h-sub">单模板 + 变量驱动 · 注册验证码 · 找回密码 · 邮箱登录</p>
    </div>
    <div class="h-meta">键 ← → 或 1·2·3·4·5 切换场景</div>
  </header>
  <main class="stage" id="stage"></main>
</div>

<nav class="proto-picker" data-position="top" aria-label="Email scenarios">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">注册验证码</button>
  <button class="proto-picker-item">找回密码</button>
  <button class="proto-picker-item">邮箱验证码登录</button>
  <button class="proto-picker-item">魔法登录·博客</button>
  <button class="proto-picker-item">魔法登录·Nomu</button>
</nav>

<script>
  const CODE = '482913';
  const LINK = 'https://kanocifer.chat/auth/magic?token=8f4a2c91d3e7b6&exp=1737350400';
  /* 预览用内联 SVG（避免 file:// 无网络），实际邮件走 LogoURL 常量。 */
  const NOMU_LOGO_SVG = (size) => `data:image/svg+xml;utf8,${encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 64 64">` +
    `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">` +
    `<stop offset="0" stop-color="#1D1D1F"/><stop offset="1" stop-color="#424245"/>` +
    `</linearGradient></defs>` +
    `<rect width="64" height="64" rx="14" fill="url(#g)"/>` +
    `<text x="32" y="44" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="38" font-weight="700" fill="white" letter-spacing="-1.5">N</text>` +
    `</svg>`
  )}`;
  /* kanocifer 博客 logo —— 预览占位（实际用 BlogLogoURL = https://cdn.kanocifer.chat/images/logo.png）。 */
  const BLOG_LOGO_SVG = (size) => `data:image/svg+xml;utf8,${encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 64 64">` +
    `<rect width="64" height="64" rx="14" fill="#1D1D1F"/>` +
    `<text x="32" y="44" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="34" font-weight="700" fill="#FFD60A" letter-spacing="-1">K</text>` +
    `</svg>`
  )}`;

  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  /* =========================================================
     Scenario 模型 —— 与 pkg/emailtemplates/email_templates.go
     中 Scenario 字段一一对应。改 prototype 时同步改 Go 端。
     ========================================================= */
  const LOGOS = {
    nomu: NOMU_LOGO_SVG(56),
    blog: BLOG_LOGO_SVG(56),
  };

  const SCENARIOS = {
    register: {
      key: 'register',
      kindLabel: '注册验证码',
      from: 'nomu@kanocifer.chat',
      date: '现在',
      vars: {
        LogoURL:      'https://nomu.kanocifer.chat/icon/128.png  (NomuLogoURL)',
        Brand:        'Nomu',
        Subtitle:     'Chrome 扩展 · 邮箱验证',
        Heading:      '这是您的验证码',
        Description:  '用于完成 Nomu 账号注册，请妥善保管。',
        Action:       { Kind: 'code', Label: CODE },
        Expiry:       '请在 5 分钟内使用。',
        SecurityNote: '验证码仅用于本次注册，不会以任何形式再次索取。若非本人操作，请忽略此邮件。',
        FooterBy:     'kanocifer.chat',
        FooterLine:   'Nomu · 注册验证码',
      },
    },
    password_reset: {
      key: 'password_reset',
      kindLabel: '找回密码',
      from: 'nomu@kanocifer.chat',
      date: '现在',
      vars: {
        LogoURL:      'https://nomu.kanocifer.chat/icon/128.png  (NomuLogoURL)',
        Brand:        'Nomu',
        Subtitle:     'Chrome 扩展 · 找回密码',
        Heading:      '重置您的密码',
        Description:  '使用以下验证码重置 Nomu 账号密码。',
        Action:       { Kind: 'code', Label: CODE },
        Expiry:       '请在 10 分钟内使用。',
        SecurityNote: '验证码仅用于本次重置，不会以任何形式再次索取。若非本人操作，请忽略此邮件。',
        FooterBy:     'kanocifer.chat',
        FooterLine:   'Nomu · 找回密码',
      },
    },
    email_code_login: {
      key: 'email_code_login',
      kindLabel: '邮箱验证码登录',
      from: 'nomu@kanocifer.chat',
      date: '现在',
      vars: {
        LogoURL:      'https://nomu.kanocifer.chat/icon/128.png  (NomuLogoURL)',
        Brand:        'Nomu',
        Subtitle:     'Chrome 扩展 · 邮箱登录',
        Heading:      '您的登录验证码',
        Description:  '使用以下验证码登录 Nomu 账号。',
        Action:       { Kind: 'code', Label: CODE },
        Expiry:       '请在 5 分钟内使用。',
        SecurityNote: '验证码仅用于本次登录，不会以任何形式再次索取。若非本人操作，请忽略此邮件。',
        FooterBy:     'kanocifer.chat',
        FooterLine:   'Nomu · 邮箱登录',
      },
    },
    magic_login_blog: {
      key: 'magic_login_blog',
      kindLabel: '魔法登录 · 博客',
      from: 'noreply@kanocifer.chat',
      date: '现在',
      vars: {
        LogoURL:      'https://cdn.kanocifer.chat/images/logo.png  (BlogLogoURL)',
        Brand:        'kanocifer.chat',
        Subtitle:     '魔法登录',
        Heading:      '点击下方按钮登录',
        Description:  '无需输入密码，单击按钮即可登录您的账号。',
        Action:       { Kind: 'button', Label: '登录 kanocifer.chat', URL: LINK },
        Expiry:       '链接 10 分钟内有效，仅可使用一次。',
        SecurityNote: '若非本人操作，请忽略此邮件。',
        FooterBy:     '',  // 自营产品，跳过"代发"行
        FooterLine:   'kanocifer.chat · 魔法登录',
      },
    },
    magic_login_nomu: {
      key: 'magic_login_nomu',
      kindLabel: '魔法登录 · Nomu',
      from: 'nomu@kanocifer.chat',
      date: '现在',
      vars: {
        LogoURL:      'https://nomu.kanocifer.chat/icon/128.png  (NomuLogoURL)',
        Brand:        'Nomu',
        Subtitle:     'Chrome 扩展 · 一键登录',
        Heading:      '点击下方按钮完成登录',
        Description:  '点击后会自动打开 Nomu 并完成登录。',
        Action:       { Kind: 'button', Label: '完成 Nomu 登录', URL: LINK },
        Expiry:       '链接 10 分钟内有效，仅可使用一次。',
        SecurityNote: '若非本人操作，请忽略此邮件。',
        FooterBy:     'kanocifer.chat',
        FooterLine:   'Nomu · 魔法登录',
      },
    },
  };

  /* =========================================================
     Pillow 模板 —— 与 Go 端 pillowTmpl 一一对应。
     主元素 (Action) 决定渲染验证码 pill 或 #007AFF CTA 按钮。
     ========================================================= */
  function logoSvgFor(brand) {
    /* brand 是 logo 的语义键：Nomu / kanocifer.chat */
    if (brand === 'kanocifer.chat') return BLOG_LOGO_SVG(56);
    return NOMU_LOGO_SVG(56);
  }

  function renderAction(v) {
    if (v.vars.Action.Kind === 'button') {
      return `
        <tr><td align="center" style="padding:8px 32px 24px;">
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
            <tr><td align="center" style="background:#007AFF;border-radius:14px;box-shadow:0 6px 16px rgba(0,122,255,0.25);">
              <a href="${esc(v.vars.Action.URL)}" target="_blank" style="display:inline-block;padding:16px 40px;font-size:15px;font-weight:600;letter-spacing:0.2px;color:#FFFFFF;text-decoration:none;">${esc(v.vars.Action.Label)}</a>
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:0 32px 12px;">
          <p style="margin:0;font-size:13px;color:#8E8E93;text-align:center;">按钮无法使用？复制以下链接到浏览器打开：</p>
        </td></tr>
        <tr><td style="padding:0 32px 24px;">
          <p style="margin:0;padding:14px 16px;background:#F5F5F7;border:1px solid #ECECEF;border-radius:10px;font-size:12px;line-height:1.6;word-break:break-all;color:#3C3C43;font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;text-align:center;">${esc(v.vars.Action.URL)}</p>
        </td></tr>`;
    }
    /* default: code pill */
    return `
        <tr><td style="padding:0 32px 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F5F7;border-radius:14px;">
            <tr><td style="padding:22px 16px;text-align:center;">
              <span style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:8px;color:#1C1C1E;">${esc(v.vars.Action.Label)}</span>
            </td></tr>
          </table>
        </td></tr>`;
  }

  function renderFooter(v) {
    if (!v.vars.FooterBy) {
      /* magic_login_blog: 单行页脚 */
      return `<p style="margin:0;font-size:12px;line-height:1.6;color:#8E8E93;">${esc(v.vars.FooterLine)}</p>`;
    }
    return `<p style="margin:0;font-size:12px;line-height:1.6;color:#8E8E93;">这封邮件由 <span style="color:#3C3C43;">${esc(v.vars.FooterBy)}</span> 代 ${esc(v.vars.Brand)} 发送</p>
            <p style="margin:2px 0 0;font-size:11px;line-height:1.6;color:#C7C7CC;">${esc(v.vars.FooterLine)}</p>`;
  }

  function renderPillow(v) {
    const logoSvg = logoSvgFor(v.vars.Brand);
    return `
    <div class="email-block">
      <div class="email-section-label">${esc(v.kindLabel)} · Pillow</div>
      <div class="email-frame">
        <div class="email-frame-meta">
          <span class="email-from">${esc(v.from)}</span>
          <span class="email-subject">${esc(v.vars.Heading)}</span>
          <span class="email-date">${esc(v.date)}</span>
        </div>
        <div class="email-frame-body">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F2F7;">
            <tr><td style="padding:40px 24px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;color:#1C1C1E;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:22px;box-shadow:0 0 0 1px rgba(0,0,0,0.04),0 12px 32px rgba(0,0,0,0.06);">
                <tr><td style="padding:36px 32px 12px;text-align:center;">
                  <img src="${logoSvg}" alt="${esc(v.vars.Brand)}" width="56" height="56" style="display:inline-block;width:56px;height:56px;border:0;outline:none;text-decoration:none;border-radius:12px;" />
                  <p style="margin:12px 0 0;font-size:15px;font-weight:600;letter-spacing:0.2px;color:#1C1C1E;">${esc(v.vars.Brand)}</p>
                  <p style="margin:2px 0 0;font-size:12px;color:#8E8E93;letter-spacing:0.2px;">${esc(v.vars.Subtitle)}</p>
                </td></tr>
                <tr><td style="padding:24px 32px 8px;">
                  <h1 style="margin:0;font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-0.018em;color:#1C1C1E;text-align:center;">${esc(v.vars.Heading)}</h1>
                </td></tr>
                <tr><td style="padding:0 32px 24px;">
                  <p style="margin:0;font-size:14px;line-height:1.55;color:#3C3C43;text-align:center;">${esc(v.vars.Description)}</p>
                </td></tr>
                ${renderAction(v)}
                <tr><td style="padding:0 32px 8px;">
                  <p style="margin:0;font-size:14px;line-height:1.55;color:#3C3C43;text-align:center;">${esc(v.vars.Expiry)}</p>
                </td></tr>
                <tr><td style="padding:0 32px 32px;">
                  <p style="margin:0;font-size:13px;line-height:1.55;color:#8E8E93;text-align:center;">${esc(v.vars.SecurityNote)}</p>
                </td></tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:20px auto 0;">
                <tr><td style="text-align:center;">
                  ${renderFooter(v)}
                </td></tr>
              </table>
            </td></tr>
          </table>
        </div>
      </div>
      <div class="fields-panel">
        <p class="fields-panel-title">Scenario · ${esc(v.key)}</p>
        ${Object.entries(v.vars).map(([k, val]) => {
          if (val && typeof val === 'object') {
            return `<span class="fields-key">${esc(k)}</span>
              <span class="fields-val">${esc(val.Kind)} · ${esc(val.Label)}${val.URL ? ' → ' + esc(val.URL) : ''}</span>`;
          }
          if (k === 'FooterBy' && val === '') {
            return `<span class="fields-key">${esc(k)}</span>
              <span class="fields-val">∅ (空字符串 — 跳过"代发"行)</span>`;
          }
          return `<span class="fields-key">${esc(k)}</span>
              <span class="fields-val">${esc(val)}</span>`;
        }).join('')}
      </div>
    </div>`;
  }

  const SCENARIO_KEYS = ['register', 'password_reset', 'email_code_login', 'magic_login_blog', 'magic_login_nomu'];

  /* ===== Picker wiring ===== */
  const stage = document.getElementById('stage');
  const picker = document.querySelector('.proto-picker');
  const highlight = picker.querySelector('.proto-picker-highlight');
  const items = [...picker.querySelectorAll('.proto-picker-item')];
  let current = 0;

  function moveHighlight() {
    const el = items[current];
    highlight.style.width = el.offsetWidth + 'px';
    highlight.style.transform = `translateX(${el.offsetLeft}px)`;
  }

  function mount(i) {
    stage.innerHTML = '';
    requestAnimationFrame(() => {
      stage.innerHTML = renderPillow(SCENARIOS[SCENARIO_KEYS[i]]);
    });
  }

  function setActive(i) {
    if (i < 0 || i >= SCENARIO_KEYS.length) return;
    current = i;
    items.forEach((el, j) => {
      el.toggleAttribute('data-active', j === i);
      if (j === i) el.setAttribute('aria-current', 'true');
      else el.removeAttribute('aria-current');
    });
    moveHighlight();
    const url = new URL(location);
    url.searchParams.set('s', SCENARIO_KEYS[i]);
    history.replaceState(null, '', url);
    mount(i);
  }

  items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));

  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= SCENARIO_KEYS.length) setActive(num - 1);
    else if (e.key === 'ArrowRight') setActive((current + 1) % SCENARIO_KEYS.length);
    else if (e.key === 'ArrowLeft') setActive((current - 1 + SCENARIO_KEYS.length) % SCENARIO_KEYS.length);
  });

  const initial = SCENARIO_KEYS.indexOf(new URLSearchParams(location.search).get('s'));
  setActive(initial >= 0 ? initial : 0);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  window.addEventListener('resize', moveHighlight);
</script>
</body>
