# ============================================================================
# kanocifer.chat — Vue SPA server block
# ----------------------------------------------------------------------------
# 用法：
#   1. 放到 /etc/nginx/sites-available/kanocifer.chat（或宝塔对应站点配置）
#   2. nginx -t && nginx -s reload
#
# 站点结构（与 frontend/deploy.sh 一致）：
#   /home/kano/blog/frontend/apps/vue-app/dist/
#     ├─ index.html            # SPA 入口（永远不缓存，部署立即生效）
#     ├─ assets/               # Vite 输出，文件名带 hash（永久缓存）
#     ├─ images/               # 静态图片（适度缓存）
#     ├─ favicon.ico
#     └─ ...
#
# 关键设计点：
#   - SPA fallback：所有不命中静态文件的请求都返回 index.html，让前端路由接住
#     （包括邮件魔法链接 /auth/magic?token=<64-hex>）
#   - 不在本机反代 /v3/*：前端通过 CORS 直接打 api.kanocifer.chat（见 cors.go）
#   - HTTPS 交给 certbot（或宝塔证书）管理
#   - 静态资源 cache-control：index.html 不缓存；assets/* 永久；images/* 7 天
# ============================================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name kanocifer.chat m.kanocifer.chat;

    # certbot ACME 挑战放行
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://kanocifer.chat$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kanocifer.chat;

    # ---- TLS（certbot 自动续期；宝塔生成的证书通常落在 /www/server/...） ----
    ssl_certificate     /etc/letsencrypt/live/kanocifer.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanocifer.chat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 注：HSTS 在 certbot 启用 --hsts 后会自动加，无需手写

    # ---- 站点根目录（与 deploy.sh 的 REMOTE_FRONTEND_BASE 对齐） ----
    root /home/kano/blog/frontend/apps/vue-app/dist;
    index index.html;

    # ---- 日志 ----
    access_log /var/log/nginx/kanocifer.chat.access.log;
    error_log  /var/log/nginx/kanocifer.chat.error.log warn;

    # ---- 字符集 / 默认 mime ----
    charset utf-8;

    # =========================================================================
    # 静态资源：永久缓存（Vite 输出文件名带 hash，文件改了 URL 也变）
    # =========================================================================
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;       # 不存在直接 404，不要被 SPA fallback 兜走
    }

    # 图片 / 字体 / favicon：适度缓存
    location ~* \.(?:ico|png|jpe?g|gif|webp|svg|avif|woff2?|ttf|otf)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # =========================================================================
    # 邮件魔法链接 SPA 落地路由
    # 用户点 https://kanocifer.chat/auth/magic?token=<64-hex>
    #   → 必须落到 index.html，由前端 SPA 读 query.token → POST /v3/magic-login
    # 这一行 location 其实被下方兜底的 try_files 已覆盖，但显式写出便于阅读 + 排错
    # =========================================================================
    location = /auth/magic {
        try_files $uri /index.html;
    }
    location = /auth/magic/ {
        try_files /index.html /index.html;
    }

    # =========================================================================
    # SPA fallback：所有"非文件"请求都返回 index.html
    # 关键：$uri 不能匹配到实际存在的静态文件，否则会被 try_files 命中而不进 fallback
    # 用 $uri/ 让带尾斜杠的路径也兜得住（如 /blog/）
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- index.html 永远不缓存（部署必须立即生效） ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ---- 健康探针（部署脚本可选，用于零停机发布） ----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- gzip（vite build 已经预生成 .br/.gz 静态文件，gzip_static 优先命中） ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # 若装了 ngx_brotli 模块，brotli_static on; 会优先命中 .br 文件
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 客户端最大 body（如果将来上传走前端直传，要再调） ----
    client_max_body_size 20m;

    # ---- 隐藏 nginx 版本 ----
    server_tokens off;
}

# ============================================================================
# 移动端 m.kanocifer.chat：与主站同部署，但单独 server_name，
# 方便将来拆 CDN / 接入 PWA / 屏蔽某些路由时不影响主站
# 现阶段直接代理到主站内容即可
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name m.kanocifer.chat;

    ssl_certificate     /etc/letsencrypt/live/kanocifer.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanocifer.chat/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /home/kano/blog/frontend/apps/vue-app/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}